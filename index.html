:root{
  --blue-30:#3A76E9;--blue-40:#3069D4;
  --radius-md:8px;--radius-lg:12px;--radius-xl:20px;
  --font-display:'Rubik',system-ui,sans-serif;--font-ui:'DM Sans','Roboto',system-ui,sans-serif;
  --deck-ink:#1B2733;--dash-tint:#F4F7FE;--dash-line:#ECEFF5;--dash-muted:#6E7C96;
  --cat-assistance-bg:#D2DAFF;--cat-assistance-fg:#3069D4;
  --cat-lifestyle-bg:#FFE2E2;--cat-lifestyle-fg:#2E3241;
  --cat-kids-bg:#FBF2A0;--cat-kids-fg:#8A7A00;
  --cat-pets-bg:#F2F4F5;--cat-pets-fg:#515160;
  --cat-mobility-bg:#B1CCFF;--cat-mobility-fg:#1B4B66;
  --cat-food-bg:#D3F7EC;--cat-food-fg:#00795A;
  --cat-services-bg:#2E3241;--cat-services-fg:#FFFFFF;
  --chart-1:#3A76E9;--chart-2:#41CC9B;--chart-4:#1B4B66;
  --shadow-sm:0 2px 8px rgba(25,28,37,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-ui);color:var(--deck-ink);background:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--dash-line)}
.row1{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:12px 40px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{height:30px;display:block}
.brand .ttl{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--deck-ink);padding-left:16px;border-left:1px solid var(--dash-line);white-space:nowrap}
.ctrls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;align-items:center;gap:4px;padding:4px;background:var(--dash-tint);border-radius:var(--radius-lg)}
.sb{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--deck-ink);font:500 14px var(--font-ui);cursor:pointer;white-space:nowrap}
.sb:hover{background:#E4EAF7}
.sb.on{background:var(--blue-30);color:#fff;box-shadow:0 2px 6px rgba(58,118,233,.25)}
.sb svg.ic{width:18px;height:18px;display:block}
.sb .n{font-size:12px;opacity:.75}
.fl{display:block;flex:none}
.row2{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 40px 12px}
.row2 .fi{width:18px;height:18px;color:var(--dash-muted);margin-right:4px;flex:none}
.cap{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid var(--dash-line);border-radius:999px;background:#fff;color:var(--deck-ink);font:500 13px var(--font-ui);cursor:pointer;white-space:nowrap}
.cap:hover{border-color:var(--blue-30)}
.cap i{width:10px;height:10px;border-radius:50%;display:block;flex:none}
.cap em{font-style:normal;font-size:12px;color:var(--dash-muted)}
.cap.on{background:var(--deck-ink);border-color:var(--deck-ink);color:#fff}
.cap.on em{color:#c9d1e0}
.cap.clr{border-style:dashed;color:var(--dash-muted)}
main{flex:1;width:100%;padding:24px 40px 32px;display:flex;flex-direction:column;gap:24px;max-width:1440px;margin:0 auto}
footer{padding:20px 40px 28px;text-align:center;font-size:13px;color:var(--dash-muted);border-top:1px solid var(--dash-line)}
.none{border:1px dashed var(--dash-line);border-radius:var(--radius-xl);padding:48px 24px;text-align:center;color:var(--dash-muted);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:24px}
.grid.one{grid-template-columns:1fr}
article{background:#fff;border:1px solid var(--dash-line);border-radius:var(--radius-xl);padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0}
.ah{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ah h2{margin:0 0 4px;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--deck-ink)}
.ah .s{font-size:14px;color:var(--dash-muted)}
.x{width:36px;height:36px;border-radius:var(--radius-md);border:1px solid var(--dash-line);background:#fff;color:var(--dash-muted);font-size:18px;cursor:pointer;line-height:1}
.x:hover{background:var(--dash-tint)}
.chart{width:100%;max-width:520px;margin:0 auto}
.chart svg{display:block;width:100%;overflow:visible;font-family:var(--font-ui)}
.chart path{cursor:pointer;transition:opacity .2s}
.chart path:hover{filter:brightness(1.06)}
.detail{background:var(--dash-tint);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:12px;min-height:112px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}
.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh span.sub{font-size:14px;color:var(--dash-muted)}
.dt{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--deck-ink)}
.dd{margin:0;font-size:15px;line-height:1.45;color:var(--dash-muted)}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.rows.r3{grid-template-columns:repeat(3,1fr)}
.rows .span2{grid-column:span 2}
.rows div{background:#fff;border-radius:var(--radius-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rows small{font-size:13px;color:var(--dash-muted)}
.rows strong{font-size:16px;font-weight:700;color:var(--deck-ink)}
.catbox{border:1px solid #2A3447;background:#F8FAFF;border-radius:var(--radius-xl);padding:16px 16px 18px;margin-bottom:24px}
.catbox:last-child{margin-bottom:0}
.cathead{margin:0 0 14px;padding-bottom:12px;border-bottom:2px solid #2A3447;display:flex;align-items:baseline;gap:10px}
.cathead b{font-family:var(--font-display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#2A3447}
.cathead span{font-size:13px;color:var(--dash-muted)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.acard{background:#F4F7FE;border:1px solid var(--dash-line);box-shadow:var(--shadow-sm);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.acard .nm{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--deck-ink)}
.acard .ds{margin:0;font-size:14px;line-height:1.4;color:var(--dash-muted)}
.acard .kv{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--dash-muted)}
.acard .kv strong{font-size:14px;color:var(--deck-ink);font-weight:500}
.sp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dash-muted)}
.sp i{width:10px;height:10px;border-radius:3px;display:block}
.tw{overflow-x:auto}

    return { id:id, name:t()[id.toLowerCase()], categories:categories, partners:partners.size, count:categories.reduce((n,c) => n + c.amenities.length, 0) };
  });
}

const S = 600, C = S/2, R0 = 70, R1 = 150, R2 = 272;
const pt = (r, a) => [C + r*Math.sin(a), C - r*Math.cos(a)];
function arcPath(r0, r1, a0, a1){
  if (a1 - a0 >= Math.PI*2 - 1e-6) a1 = a0 + Math.PI*2 - 1e-4;
  const L = a1 - a0 > Math.PI ? 1 : 0;
  const p0 = pt(r1,a0), p1 = pt(r1,a1), p2 = pt(r0,a1), p3 = pt(r0,a0);
  return 'M'+p0+'A'+r1+','+r1+' 0 '+L+' 1 '+p1+'L'+p2+'A'+r0+','+r0+' 0 '+L+' 0 '+p3+'Z';
}
const ctx = document.createElement('canvas').getContext('2d');
const textW = (s, size, w) => { ctx.font = w+' '+size+"px 'DM Sans', Roboto, sans-serif"; return ctx.measureText(s).width; };
function fitLines(name, maxW, maxLines, size, weight){
  const words = name.split(' '), lines = [];
  let cur = '';
  for (const w of words){
    const tt = cur ? cur+' '+w : w;
    if (!cur || textW(tt,size,weight) <= maxW) cur = tt; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  const cut = lines.length > maxLines;
  const out = lines.slice(0, maxLines);
  return out.map((l,i) => {
    let s = l + (i === out.length-1 && cut ? '…' : '');
    while (s.length > 2 && textW(s,size,weight) > maxW) s = s.slice(0,-2) + '…';
    return s;
  });
}
function radialLabel(name, r0, r1, a0, a1, fontSize, weight, fill){
  const r = (r0+r1)/2, arcLen = (a1-a0)*r, maxW = (r1-r0) - 8;
  let size = fontSize;
  const longest = name.split(' ').reduce((m,w) => Math.max(m, textW(w,size,weight)), 0);
  if (longest > maxW) size = Math.max(9.5, Math.floor(size*maxW/longest*2)/2);
  const lh = size*1.15, maxLines = Math.min(3, Math.floor((arcLen-2)/lh));
  if (maxLines < 1) return '';
  const lines = fitLines(name, maxW, maxLines, size, weight);
  const mid = (a0+a1)/2, deg = mid*180/Math.PI, p = pt(r,mid), x = p[0], y = p[1];
  const flip = deg > 180, off = -((lines.length-1)*lh)/2;
  return '<text x="'+x+'" y="'+y+'" transform="rotate('+(flip ? deg+90 : deg-90)+' '+x+' '+y+')" text-anchor="middle" style="pointer-events:none;font-size:'+size+'px;font-weight:'+weight+';fill:'+fill+'">'
    + lines.map((l,i) => '<tspan x="'+x+'" y="'+(y+off+i*lh)+'" dominant-baseline="central">'+esc(l)+'</tspan>').join('') + '</text>';
}

function chart(m){
  const z = state.zoom[m.id], sel = state.sel[m.id];
  const zz = z != null && m.categories[z] ? z : null;
  const cats = zz != null ? [m.categories[zz]] : m.categories;
  const total = cats.reduce((n,c) => n + c.amenities.length, 0), pad = 0.004;
  let out = '', ang = 0;
  cats.forEach(c => {
    const ci = m.categories.indexOf(c), key = c.key;
    const span = (c.amenities.length/total)*Math.PI*2, ca0 = ang, ca1 = ang + span;
    out += '<path data-act="cat" data-c="'+ci+'" d="'+arcPath(R0+2,R1,ca0+pad,ca1-pad)+'" fill="var(--cat-'+key+'-bg)" stroke="var(--cat-'+key+'-fg)" stroke-width="1" opacity="'+(sel && sel.c !== ci ? .45 : 1)+'"><title>'+esc(c.name+' · '+t().pl(c.partnerCount)+' · '+t().am(c.amenities.length))+'</title></path>';
    out += radialLabel(c.name, R0+2, R1, ca0, ca1, 13, 700, 'var(--cat-'+key+'-fg)');
    c.amenities.forEach((am, ai) => {
      const a0 = ang + (ai/c.amenities.length)*span, a1 = ang + ((ai+1)/c.amenities.length)*span;
      const isSel = sel && sel.c === ci && sel.a === ai;
      out += '<path data-act="am" data-c="'+ci+'" data-a="'+ai+'" d="'+arcPath(R1+3, isSel ? R2+8 : R2, a0+pad, a1-pad)+'" fill="'+WAYS[am.setup]+'" opacity="'+(sel && !isSel ? .35 : 1)+'"><title>'+esc(am.name)+'</title></path>';
      out += radialLabel(am.name, R1+3, R2, a0, a1, 11, 500, '#fff');
    });
    ang = ca1;
  });
  const rf = 40;
  out += '<g data-act="center" style="cursor:pointer"><circle cx="'+C+'" cy="'+C+'" r="'+(R0-4)+'" fill="var(--dash-tint)"/>'
    + '<svg x="'+(C-rf)+'" y="'+(C-rf-(zz != null ? 8 : 0))+'" width="'+(rf*2)+'" height="'+(rf*2)+'" viewBox="0 0 60 60"><defs><clipPath id="cf-'+m.id+'"><circle cx="30" cy="30" r="30"/></clipPath></defs><g clip-path="url(#cf-'+m.id+')">'+FLAGS[m.id]+'</g><circle cx="30" cy="30" r="29.6" fill="none" stroke="rgba(25,28,37,.18)" stroke-width=".8"/></svg>'
    + (zz != null ? '<text x="'+C+'" y="'+(C+rf-2)+'" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:var(--dash-muted)">'+esc(t().zoomOut)+'</text>' : '')
    + '<title>'+esc(zz != null ? t().zoomOut : t().closeChart)+'</title></g>';
  return '<svg viewBox="0 0 '+S+' '+S+'" role="img" aria-label="'+esc(t().aria(m.name))+'">'+out+'</svg>';
}

const chipHtml = (txt, key) => '<span class="chip" style="background:var(--cat-'+key+'-bg);color:var(--cat-'+key+'-fg)">'+esc(txt)+'</span>';

function detail(m){
  const z = state.zoom[m.id], sel = state.sel[m.id];
  if (sel && m.categories[sel.c] && m.categories[sel.c].amenities[sel.a]){
    const c = m.categories[sel.c], am = c.amenities[sel.a];
    return '<div class="dh">'+chipHtml(c.name,c.key)+'<span class="sub">'+esc(setupLbl(am.setup))+'</span></div>'
      + '<div class="dt">'+esc(am.name)+'</div>'
      + (am.description ? '<p class="dd">'+esc(am.description)+'</p>' : '')
      + '<div class="rows r3"><div><small>'+esc(t().benefit)+'</small><strong>'+esc(am.benefit)+'</strong></div>'+(am.scope ? '<div class="span2"><small>'+esc(t().scope)+'</small><strong>'+esc(fmtScope(am.scope))+'</strong></div>' : '')+'</div>';
  }
  if (z != null && m.categories[z]){
    const c = m.categories[z];
    const rows = setupOrder.map(w => [w, c.amenities.filter(x => x.setup === w).length]).filter(r => r[1] > 0);
    return '<div class="dh">'+chipHtml(t().category,c.key)+'<span class="sub">'+t().pl(c.partnerCount)+' · '+t().am(c.amenities.length)+'</span></div>'
      + '<div class="dt">'+esc(c.name)+'</div>'
      + '<div class="rows">'+rows.map(r => '<div><small>'+esc(setupLbl(r[0]))+'</small><strong>'+r[1]+'</strong></div>').join('')+'</div>';
  }
  return '<div class="dh">'+chipHtml(t().ovr,'services')+'<span class="sub">'+esc(t().select)+'</span></div>'
    + '<div class="dt">'+esc(t().overview(m))+'</div>';
}

function gridHtml(m){
  return m.categories.map(c =>
    '<section class="catbox"><div class="cathead"><b>'+esc(c.name)+'</b><span>'+t().am(c.amenities.length)+'</span></div>'
    + '<div class="agrid">' + c.amenities.map(am =>
      '<div class="acard"><div class="nm">'+esc(am.name)+'</div>'
      + '<div class="sp"><i style="background:'+WAYS[am.setup]+'"></i>'+esc(setupLbl(am.setup))+'</div>'
      + (am.description ? '<p class="ds">'+esc(am.description)+'</p>' : '')
      + '<div class="kv"><span>'+esc(t().benefit)+'</span><strong>'+esc(am.benefit)+'</strong></div>'
      + (am.scope ? '<div class="kv"><span>'+esc(t().scope)+'</span><strong>'+esc(fmtScope(am.scope))+'</strong></div>' : '')
      + '</div>').join('') + '</div></section>').join('');
}
function listHtml(m){
  let rows = '';
  m.categories.forEach(c => c.amenities.forEach(am => {
    rows += '<tr><td><strong>'+esc(am.name)+'</strong></td><td>'+chipHtml(c.name, c.key)+'</td>'
      + '<td><span class="sp"><i style="background:'+WAYS[am.setup]+'"></i>'+esc(setupLbl(am.setup))+'</span></td>'
      + '<td class="mu">'+esc(am.description)+'</td><td>'+esc(am.benefit)+'</td><td>'+esc(fmtScope(am.scope))+'</td></tr>';
  }));
  return '<div class="tw"><table class="alist"><thead><tr><th>'+esc(t().colAmenity)+'</th><th>'+esc(t().category)+'</th><th>'+esc(t().colSetup)+'</th><th>'+esc(t().colDesc)+'</th><th>'+esc(t().benefit)+'</th><th>'+esc(t().scope)+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function bodyFor(m){
  if (!m.count) return '<div class="none">'+esc(t().noMatch)+'</div>';
  if (state.view === 'grid') return gridHtml(m);
  if (state.view === 'list') return listHtml(m);
  return '<div class="chart">'+chart(m)+'</div><div class="detail">'+detail(m)+'</div>';
}

function render(){
  const T = t();
  document.documentElement.lang = state.lang;
  document.title = 'Smart Point | ' + T.title;
  document.getElementById('ttl').textContent = T.title;
  const markets = buildMarkets();
  const totals = MARKET_IDS.map(id => ({ id:id, n:dataset.reduce((k, cat) => k + cat.partners.reduce((j, p) => j + p.amenities.filter(x => x.location === id).length, 0), 0) }));
  document.getElementById('markets').innerHTML = totals.map(m =>
    '<button class="sb'+(state.open[m.id] ? ' on' : '')+'" data-act="toggle" data-m="'+m.id+'">'+flagSvg(m.id,20)+'<span>'+esc(T[m.id.toLowerCase()])+'</span><span class="n">'+m.n+'</span></button>').join('');
  document.getElementById('views').innerHTML = ['circle','grid','list'].map(v =>
    '<button class="sb'+(state.view === v ? ' on' : '')+'" data-act="view" data-v="'+v+'" aria-label="'+esc(T[v])+'">'+ICONS[v]+'<span>'+esc(T[v])+'</span></button>').join('');
  document.getElementById('langs').innerHTML = ['en','es'].map(l =>
    '<button class="sb'+(state.lang === l ? ' on' : '')+'" data-act="lang" data-l="'+l+'" aria-label="'+(l === 'en' ? 'English' : 'Español')+'">'+l.toUpperCase()+'</button>').join('');
  const counts = {};
  dataset.forEach(cat => cat.partners.forEach(p => p.amenities.forEach(x => { counts[x.setup] = (counts[x.setup]||0) + 1; })));
  const anyOn = setupOrder.some(k => state.filter[k]);
  document.getElementById('caps').innerHTML = FILTER_ICON + setupOrder.filter(k => counts[k]).map(k =>
    '<button class="cap'+(state.filter[k] ? ' on' : '')+'" data-act="cap" data-s="'+esc(k)+'" aria-pressed="'+(state.filter[k] ? 'true' : 'false')+'"><i style="background:'+WAYS[k]+'"></i>'+esc(setupLbl(k))+' <em>'+counts[k]+'</em></button>').join('')
    + (anyOn ? '<button class="cap clr" data-act="capclear">'+esc(T.clear)+'</button>' : '');
  const open = markets.filter(m => state.open[m.id]);
  const none = document.getElementById('none');
  none.hidden = open.length > 0; none.textContent = T.noMarket;
  document.getElementById('grid').className = state.view === 'circle' ? 'grid' : 'grid one';
  document.getElementById('grid').innerHTML = open.map(m =>
    '<article data-m="'+m.id+'"><div class="ah"><div><h2>'+flagSvg(m.id,28)+esc(m.name)+'</h2><span class="s">'+T.pl(m.partners)+' · '+T.am(m.count)+'</span></div>'
    + '<button class="x" data-act="close" aria-label="'+esc(T.close)+'">&times;</button></div>'
    + bodyFor(m) + '</article>').join('');
  document.getElementById('foot').textContent = T.updated + ' ' + fmtDate(UPDATED);
}

function resetView(){ state.zoom = {}; state.sel = {}; }
function toggle(id){ state.open[id] = !state.open[id]; state.zoom[id] = null; state.sel[id] = null; render(); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const art = el.closest('article'), id = art ? art.dataset.m : null, act = el.dataset.act;
  if (act === 'lang'){ state.lang = el.dataset.l; try { localStorage.setItem('sp-lang', state.lang); } catch(er) {} return render(); }
  if (act === 'view'){ state.view = el.dataset.v; return render(); }
  if (act === 'cap'){ state.filter[el.dataset.s] = !state.filter[el.dataset.s]; resetView(); return render(); }
  if (act === 'capclear'){ state.filter = {}; resetView(); return render(); }
  if (act === 'toggle') return toggle(el.dataset.m);
  if (act === 'close') return toggle(id);
  if (act === 'cat'){ state.zoom[id] = +el.dataset.c; state.sel[id] = null; return render(); }
  if (act === 'am'){
    const c = +el.dataset.c, a = +el.dataset.a, s = state.sel[id];
    state.sel[id] = s && s.c === c && s.a === a ? null : { c:c, a:a };
    return render();
  }
  if (act === 'center'){
    if (state.zoom[id] != null){ state.zoom[id] = null; state.sel[id] = null; render(); } else toggle(id);
  }
});
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
